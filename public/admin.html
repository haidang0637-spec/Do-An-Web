<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hải Đăng Fly - Luxury Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #f8fafc; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        
        /* Hiệu ứng kính */
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(223, 186, 115, 0.05); 
        }
        
        /* Thanh cuộn phong cách Luxury */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #DFBA73; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #C5A059; }
    </style>
</head>
<body class="flex h-screen overflow-hidden antialiased selection:bg-[#DFBA73] selection:text-[#0f172a]">
    
    <!-- Thanh công cụ bên trái (Sidebar) -->
    <aside class="w-72 flex flex-col relative z-20 border-r border-[#DFBA73]/10 bg-[#0a0a0a]">
        <!-- Logo -->
        <div class="p-8 border-b border-[#DFBA73]/10">
            <h1 class="text-2xl font-playfair font-bold text-transparent bg-clip-text bg-gradient-to-r from-[#DFBA73] to-[#FDE08B] flex items-center gap-3 tracking-wide">
                <i class="fa-solid fa-crown text-xl text-[#DFBA73]"></i> Admin Panel
            </h1>
            <p class="text-xs text-slate-500 mt-2 font-medium tracking-widest uppercase">Hệ thống quản trị</p>
        </div>
        
        <!-- Menu -->
        <nav class="flex-1 p-5 space-y-3">
            <button onclick="switchTab('flights', this)" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition-all duration-300 bg-gradient-to-r from-[#DFBA73]/10 to-transparent text-[#DFBA73] border-l-2 border-[#DFBA73]">
                <i class="fa-solid fa-plane-departure w-5 text-lg"></i> <span class="font-bold tracking-wide text-sm uppercase">Chuyến Bay</span>
            </button>
            <button onclick="switchTab('bookings', this)" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition-all duration-300 text-slate-500 hover:text-[#DFBA73] hover:bg-white/5 border-l-2 border-transparent">
                <i class="fa-solid fa-ticket w-5 text-lg"></i> <span class="font-bold tracking-wide text-sm uppercase">Đặt Vé</span>
            </button>
            <button onclick="switchTab('contacts', this)" class="nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition-all duration-300 text-slate-500 hover:text-[#DFBA73] hover:bg-white/5 border-l-2 border-transparent">
                <i class="fa-solid fa-envelope w-5 text-lg"></i> <span class="font-bold tracking-wide text-sm uppercase">Liên Hệ</span>
            </button>
        </nav>
        
        <!-- Nút về trang chủ -->
        <div class="p-6 border-t border-[#DFBA73]/10">
            <a href="/" target="_blank" class="flex items-center justify-center gap-2 w-full p-3 rounded-xl border border-[#DFBA73]/20 text-[#DFBA73] hover:bg-[#DFBA73] hover:text-[#0f172a] transition-all duration-300 font-bold shadow-[0_0_15px_rgba(223,186,115,0.1)]">
                <i class="fa-solid fa-globe"></i> Xem trang Khách
            </a>
        </div>
    </aside>

    <!-- Khu vực nội dung chính -->
    <main class="flex-1 flex flex-col relative z-10 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-[#050505]">
        <!-- Header -->
        <header class="glass px-10 py-6 flex justify-between items-center border-b border-[#DFBA73]/10 z-10 sticky top-0">
            <h2 id="page-title" class="text-3xl font-playfair font-bold text-white tracking-wide">Quản lý Chuyến Bay</h2>
            <div class="flex items-center gap-6">
                <button id="btn-add" onclick="showAddFlightModal()" class="hidden bg-gradient-to-r from-[#DFBA73] to-[#C5A059] text-[#0f172a] px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-[#DFBA73]/20 hover:scale-105 transition-transform flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Thêm chuyến bay
                </button>
                <div class="flex items-center gap-3 pl-6 border-l border-white/10">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-white">Admin Hải Đăng</div>
                        <div class="text-xs text-[#DFBA73]">Super Admin</div>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-[#DFBA73]/10 border border-[#DFBA73]/50 flex items-center justify-center text-[#DFBA73] shadow-[0_0_10px_rgba(223,186,115,0.2)]">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Khu vực bảng dữ liệu -->
        <div class="flex-1 p-10 overflow-y-auto">
            <div class="glass rounded-2xl overflow-hidden shadow-2xl border border-white/5">
                <table class="w-full text-left border-collapse">
                    <thead id="table-head" class="bg-[#0a0a0a] text-[#DFBA73] border-b border-[#DFBA73]/20 text-xs uppercase tracking-widest font-bold">
                        <!-- Đổ dữ liệu từ JS -->
                    </thead>
                    <tbody id="table-body" class="divide-y divide-white/5 text-sm">
                        <!-- Đổ dữ liệu từ JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Thêm Chuyến Bay (Pop-up) -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4 transition-opacity duration-300">
        <div class="glass bg-[#0a0a0a]/95 p-10 rounded-3xl shadow-[0_0_50px_rgba(223,186,115,0.1)] w-full max-w-lg border border-[#DFBA73]/30 relative overflow-hidden">
            <!-- Tia sáng trang trí -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#DFBA73] to-transparent opacity-50"></div>
            
            <h3 class="text-3xl font-playfair font-bold text-transparent bg-clip-text bg-gradient-to-r from-[#DFBA73] to-[#FDE08B] mb-8 flex items-center gap-3">
                <i class="fa-solid fa-plane-up text-[#DFBA73]"></i> Thêm chuyến bay
            </h3>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[#DFBA73] text-xs font-bold uppercase tracking-wider mb-2">Mã chuyến bay</label>
                    <input type="text" id="flight_code" placeholder="VD: VN-245" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-[#DFBA73] focus:bg-white/10 transition-all placeholder:text-slate-600">
                </div>
                <div class="flex gap-5">
                    <div class="flex-1">
                        <label class="block text-[#DFBA73] text-xs font-bold uppercase tracking-wider mb-2">Điểm đi</label>
                        <input type="text" id="departure" placeholder="VD: Hà Nội" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-[#DFBA73] focus:bg-white/10 transition-all placeholder:text-slate-600">
                    </div>
                    <div class="flex-1">
                        <label class="block text-[#DFBA73] text-xs font-bold uppercase tracking-wider mb-2">Điểm đến</label>
                        <input type="text" id="destination" placeholder="VD: Đà Nẵng" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-[#DFBA73] focus:bg-white/10 transition-all placeholder:text-slate-600">
                    </div>
                </div>
                <div class="flex gap-5">
                    <div class="flex-1">
                        <label class="block text-[#DFBA73] text-xs font-bold uppercase tracking-wider mb-2">Giờ bay</label>
                        <input type="datetime-local" id="time" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-[#DFBA73] focus:bg-white/10 transition-all [color-scheme:dark]">
                    </div>
                    <div class="flex-1">
                        <label class="block text-[#DFBA73] text-xs font-bold uppercase tracking-wider mb-2">Giá vé (VNĐ)</label>
                        <input type="number" id="price" placeholder="VD: 1500000" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-[#DFBA73] focus:bg-white/10 transition-all placeholder:text-slate-600">
                    </div>
                </div>
            </div>
            
            <div class="mt-10 flex justify-end gap-4">
                <button onclick="document.getElementById('add-modal').classList.add('hidden')" class="px-6 py-3 rounded-xl border border-white/10 text-slate-400 hover:text-white hover:bg-white/5 transition-all font-bold">Hủy bỏ</button>
                <button onclick="submitFlight()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-[#DFBA73] to-[#C5A059] text-[#0f172a] font-bold hover:shadow-[0_0_20px_rgba(223,186,115,0.4)] hover:scale-105 transition-all">Lưu hệ thống</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ (GIỮ NGUYÊN TÍNH NĂNG) -->
        <script>
        let currentTab = 'flights';

        // Đổi Tab
        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.className = 'nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition-all duration-300 text-slate-500 hover:text-[#DFBA73] hover:bg-white/5 border-l-2 border-transparent';
            });
            btn.className = 'nav-btn w-full flex items-center gap-4 p-4 rounded-xl transition-all duration-300 bg-gradient-to-r from-[#DFBA73]/10 to-transparent text-[#DFBA73] border-l-2 border-[#DFBA73]';

            if (tab === 'flights') loadFlights();
            if (tab === 'bookings') loadBookings();
            if (tab === 'contacts') loadContacts();
        }

        async function loadFlights() {
            document.getElementById('page-title').innerText = "Quản lý Chuyến Bay";
            document.getElementById('btn-add').classList.remove('hidden');
            
            const res = await fetch('/api/flights');
            const data = await res.json();
            
            document.getElementById('table-head').innerHTML = `
                <tr>
                    <th class="p-6 font-bold w-20">ID</th>
                    <th class="p-6 font-bold">Mã CB</th>
                    <th class="p-6 font-bold">Hành trình bay</th>
                    <th class="p-6 font-bold">Thời gian khởi hành</th>
                    <th class="p-6 font-bold">Giá vé niêm yết</th>
                    <th class="p-6 font-bold text-right">Thao tác</th>
                </tr>
            `;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors group">
                        <td class="p-6 text-slate-500 font-bold">#${item.id}</td>
                        <td class="p-6"><span class="px-3 py-1 rounded-md bg-[#DFBA73]/10 text-[#DFBA73] border border-[#DFBA73]/30 font-bold tracking-wider">${item.flight_code}</span></td>
                        <td class="p-6 text-white text-base"><span class="font-medium">${item.departure}</span> <i class="fa-solid fa-arrow-right-long text-[#DFBA73] mx-3 opacity-50"></i> <span class="font-medium">${item.destination}</span></td>
                        <td class="p-6 text-slate-300"><div class="flex items-center gap-2"><i class="fa-regular fa-clock text-[#DFBA73]"></i>${new Date(item.departure_time).toLocaleString('vi-VN')}</div></td>
                        <td class="p-6 text-[#DFBA73] font-bold text-base">${item.price.toLocaleString('vi-VN')} VNĐ</td>
                        <td class="p-6 text-right"><button onclick="deleteFlight(${item.id})" class="w-10 h-10 rounded-full bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition-all flex items-center justify-center ml-auto"><i class="fa-solid fa-trash-can"></i></button></td>
                    </tr>
                `;
            });
        }

        async function loadBookings() {
            document.getElementById('page-title').innerText = "Quản lý Đặt Vé";
            document.getElementById('btn-add').classList.add('hidden');
            const res = await fetch('/api/admin/bookings');
            const data = await res.json();
            
            document.getElementById('table-head').innerHTML = `
                <tr>
                    <th class="p-6 font-bold w-24">Mã PNR</th>
                    <th class="p-6 font-bold">Khách Hàng</th>
                    <th class="p-6 font-bold">Chuyến Bay</th>
                    <th class="p-6 font-bold">Hạng Ghế</th>
                    <th class="p-6 font-bold">Tổng Thanh Toán</th>
                    <th class="p-6 font-bold">Thời Gian Đặt</th>
                </tr>
            `;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                const isBusiness = item.seat_type === 'business';
                const seatBadge = isBusiness ? '<span class="px-3 py-1 bg-gradient-to-r from-[#DFBA73] to-[#C5A059] text-[#0f172a] rounded-md font-bold shadow-md uppercase text-[10px] tracking-widest"><i class="fa-solid fa-crown mr-1"></i>Thương gia</span>' : '<span class="px-3 py-1 bg-white/10 text-slate-300 rounded-md border border-white/10 uppercase text-[10px] tracking-widest font-bold">Phổ thông</span>';

                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-6 font-playfair text-[#DFBA73] font-bold text-lg">HDF-${item.id}</td>
                        <td class="p-6"><div class="font-bold text-white text-base">${item.passenger_name}</div><div class="text-sm text-slate-400 mt-1 flex items-center gap-2"><i class="fa-solid fa-phone text-[#DFBA73]/70"></i> ${item.passenger_phone}</div></td>
                        <td class="p-6 font-bold text-slate-300">${item.flight_code}</td>
                        <td class="p-6">${seatBadge}</td>
                        <td class="p-6 text-emerald-400 font-bold text-base">${item.total_price.toLocaleString('vi-VN')} VNĐ</td>
                        <td class="p-6 text-slate-500 text-sm italic">${new Date(item.created_at).toLocaleString('vi-VN')}</td>
                    </tr>
                `;
            });
        }

        async function loadContacts() {
            document.getElementById('page-title').innerText = "Quản lý Góp Ý & Liên Hệ";
            document.getElementById('btn-add').classList.add('hidden');
            const res = await fetch('/api/admin/contacts');
            const data = await res.json();
            
            document.getElementById('table-head').innerHTML = `
                <tr>
                    <th class="p-6 font-bold w-1/4">Thông tin Khách</th>
                    <th class="p-6 font-bold w-2/4">Nội Dung Yêu Cầu</th>
                    <th class="p-6 font-bold text-center">Trạng Thái</th>
                    <th class="p-6 font-bold text-right">Phản hồi</th>
                </tr>
            `;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-6 align-top"><div class="font-bold text-white text-base mb-1">${item.name}</div><div class="text-slate-400 text-sm flex items-center gap-2"><i class="fa-solid fa-envelope text-[#DFBA73]"></i> ${item.email}</div></td>
                        <td class="p-6 align-top"><div class="font-bold text-[#DFBA73] mb-2 text-base">${item.subject}</div><div class="text-slate-300 leading-relaxed bg-black/30 p-3 rounded-lg border border-white/5 italic">"${item.message}"</div></td>
                        <td class="p-6 text-center align-top"><span class="px-4 py-1.5 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-full text-xs font-bold inline-flex items-center gap-2 shadow-[0_0_10px_rgba(244,63,94,0.1)]"><i class="fa-solid fa-circle-dot text-[8px] fa-fade"></i> Chờ xử lý</span></td>
                        <td class="p-6 text-right align-top"><a href="mailto:${item.email}?subject=Phản hồi từ Ban Quản Trị Hải Đăng Fly về yêu cầu: ${item.subject}" class="bg-gradient-to-r from-[#DFBA73] to-[#C5A059] hover:brightness-110 text-[#0f172a] font-bold py-2.5 px-5 rounded-xl shadow-lg transition-all inline-flex items-center gap-2 hover:scale-105"><i class="fa-solid fa-paper-plane"></i> Gửi Mail</a></td>
                    </tr>
                `;
            });
        }

        function showAddFlightModal() { document.getElementById('add-modal').classList.remove('hidden'); }

        async function submitFlight() {
            let timeVal = document.getElementById('time').value;
            let formattedTime = timeVal ? timeVal.replace('T', ' ') + ':00' : '';
            const data = {
                flight_code: document.getElementById('flight_code').value,
                departure: document.getElementById('departure').value,
                destination: document.getElementById('destination').value,
                departure_time: formattedTime,
                price: document.getElementById('price').value
            };
            if(!data.flight_code || !data.departure || !data.destination || !data.departure_time || !data.price) return alert("⚠️ Vui lòng nhập ĐẦY ĐỦ tất cả các ô!");
            try {
                const res = await fetch('/api/flights', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if (!res.ok) return alert("❌ Lỗi: Mã chuyến bay này ĐÃ TỒN TẠI! Vui lòng nhập mã khác.");
                document.getElementById('add-modal').classList.add('hidden');
                document.querySelectorAll('input').forEach(i => i.value = '');
                loadFlights();
                alert("✅ Đã thêm chuyến bay mới thành công!");
            } catch (err) { alert("❌ Máy chủ bị lỗi kết nối!"); console.error(err); }
        }

        async function deleteFlight(id) {
            if(!confirm("Bạn có chắc chắn muốn hủy chuyến bay này?")) return;
            await fetch(`/api/flights/${id}`, { method: 'DELETE' });
            loadFlights();
        }

        document.addEventListener('DOMContentLoaded', () => { loadFlights(); });
    </script>
</body>
</html>
